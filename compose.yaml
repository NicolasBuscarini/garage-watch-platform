services:
  api:
    image: garage-watch-platform-dev
    build:
      context: .
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - dotnet
      - run
      - --project
      - src/GarageWatch.Api/GarageWatch.Api.csproj
      - --urls
      - http://0.0.0.0:8080

  test:
    image: garage-watch-platform-dev
    build:
      context: .
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    profiles: [test]
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DOTNET_CLI_HOME: /tmp
      NUGET_PACKAGES: /tmp/nuget
      HOME: /tmp
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - dotnet
      - test
      - GarageWatch.slnx
      - --configuration
      - Release
